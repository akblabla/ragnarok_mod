  # UNIT DESCRIPTIONS
  unit_description_soldier: "Basic infantry, useful for capturing structures. Critical hit when adjacent to its commander."
  unit_description_villager: "Simple peasants. They're not equipped to fight, and are vulnerable to just about everything."
  unit_description_spearman: "Slower, more powerful infantry. Critical hit when adjacent to another spearman."
  unit_description_archer: "Ranged ground units able to move and attack in the same turn. Critical hit when stationary."
  unit_description_dog: "A quick unit. Critical hit when another dog unit is adjacent to the target."
  unit_description_mage: "A powerful unit built to combat naval and air units. Critical hit when defence is 3 or above. Able to heal allied targets by 20%."
  unit_description_warship: "An immensely powerful long range unit. Critical hit when on beach."
  unit_description_harpoonship: "Ranged anti-air water unit. It is also strong vs sea creatures. Critical hit when in reef."
  unit_description_dragon: "Incredibly powerful air-to-ground unit. Critical hit when target is standing on a road."
  unit_description_knight: "Powerful, mobile ground unit. Critical hit when it attacks from a location six spaces away from where it starts."
  unit_description_wagon: "Capable of quickly transporting units that would otherwise travel by foot."
  unit_description_trebuchet: "Powerful long-range unit, unable to move and attack in the same turn. Critical hit at max range."
  unit_description_merman: "Ranged Amphibious infantry unit that can capture structures. Critical hit when in rivers or sea."
  unit_description_turtle: "Powerful naval unit, built to conquer the water. Critical hit when in deep sea."
  unit_description_witch: "Air-to-air unit. Critical hit when target is not adjacent to its own allied witch. Hex deals 10% damage to all unit types."
  unit_description_harpy: "Immensely mobile units, useful for crossing enemy lines. Critical hit when above a mountain."
  unit_description_balloon: "Aircraft able to transport footsoldiers and Dog units."
  unit_description_giant: "An immensely powerful unit. Critical hit when at or below 40% health."
  unit_description_ballista: "Ranged ground-to-air unit, unable to move and attack in the same turn. Critical hit at min range."
  unit_description_travelboat: "Boats able to transport all ground units across water. Can steal from buildings."  
  unit_description_travelboat_with_gold: "A vulnerable unit that cannot transport, but is able to deposit the gold it has stolen at a friendly Flagship, Warship or Dock. If defeated, the gold goes to the attacker."  
  unit_description_rifleman: "A long-range ground unit. Can't target enemies behind other units or tall terrain. Critical hit when target is in the centre of the Rifleman's sights."
  unit_description_griffin_walking: "Flies over units, but must land on solid ground. Crit when ally is opposite to target."
  unit_description_caravel: "Cost-effective for neutralizing structures. Crit when target is adjacent to a structure. Strong vs Ships."
  unit_description_kraken: "Naval supremacist. Tentacle ability immobilizes a unit for one turn (Range: 3).\nCritical hit when enemy has no adjacent allies."
