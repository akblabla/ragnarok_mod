weapons:
  - id: flagship_cannon
    rangeMin: 1
    rangeMax: 2
    canMoveAndAttack: true
    baseDamage:
      land: 1
      water: 1
      buildings: 1
    tagDamageOverwrite: commander

unitClasses:
  - id: commander_flagship_wulfar
    name: unit_class_name_flagship_wulfar
    cost: 500
    movement: sailing
    moveRange: 6.0
    aiPriority: 4.0
    weapons:
      - id: flagship_cannon
    verbs:
      - rescue
      - attack_AI
      - hire
      - take_crown
      - pirate_claim
      - groove_broadside
      - mini_groove_ram
    cargoSpace: 2
    tags:
      - commander
      - flagship
      - type.sea
      - sailing
    battleUnitCount: 1
    passiveMultiplier: 1
    sightRange: 4
    regeneration: 5
    isCommander: true
    grooveId: groove_broadside
    isHiddenInCutsceneEditor: true
    deathVerbId: death

units:
