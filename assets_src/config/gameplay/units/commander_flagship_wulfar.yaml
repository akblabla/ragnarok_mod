    faction: outlaw
    name: unit_name_flagship_wulfar
    mapLightSource:
      sprite: lights_medium
      scale: [1.0, 1.0]
      jitter:
        scale: 1.0
        frequency: 0.3
        frequencyVariance: 0.15
    battleLightSource:
      sprite: lights_battle_ship
      scale: [1.5, 1.0]
      jitter:
        scale: 0.25
        frequency: 0.3
        frequencyVariance: 0.15
    mapAnimation: units/commanders/flagship/map_flagship
    battleAnimation: units/commanders/flagship/battle_flagship_wulfar
    smallPortrait: units/warship/outlaw/portrait_warship_outlaw_small.png
    mediumPortrait: units/warship/outlaw/portrait_warship_outlaw_medium.png
    mapSpeed: 6.0
    skinColour: typeII
    grabPos: [10, 9]
    deathMoveMin: 80
    deathMoveMax: 80
    sounds:
      attackMap: unitAttack
      attack: flagshipWulfarAttack
      attackEffect: warshipAttackEffect
      death: shipDie
      deathMap: unitDie
      run: waterBoatEntry
      runMap: waterBoatEntry
      hit: hitWood
      hitMap: hitWood
    attacks:
      - id: primary
        hitDelay: 2.0
        hitSpark: fx/bs_stab_attack
        ranged: true
        effect: fx/bs_warship_attack
        effectDelay: 1.8
        hitDelay: [2.0, 2.3, 2.6]
