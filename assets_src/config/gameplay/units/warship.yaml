---
weapons:
  - id: warshipCannon
    rangeMin: 3
    rangeMax: 4
    canMoveAndAttack: true
    canAttackSecondaryTiles: false
    baseDamage:
      land: 1
      buildings: 1
      
unitClasses:  
  - id: warship
    name: unit_class_name_warship
    cost: 900
    resourceCost: 3
    movement: sailing
    moveRange: 6.0
    damageMultiplier: 1
    aiPriority: 1.0
    weapons:
      - id: warshipCannon
    cargoSpace: 2
    tags:
      - warship
      - type.sea.heavy
    verbs:
      - rescue
      - attack_AI
      - hire
      - take_crown
    battleUnitCount: 1
    passiveMultiplier: 1.5
    sightRange: 4
    isHiddenInCutsceneEditor: true

units:
  - class: warship
    faction: cherrystone
    name: unit_name_warship_cherrystone
    mapAnimation: units/warship/cherrystone/map_warship_cherrystone
    mapLightSource:
      sprite: lights_medium
      scale: [1.0, 1.0]
      jitter:
        scale: 1.0
        frequency: 0.3
        frequencyVariance: 0.15
    battleLightSource:
      sprite: lights_battle_ship
      scale: [1.5, 1.0]
      jitter:
        scale: 0.25
        frequency: 0.3
        frequencyVariance: 0.15
    battleAnimation: units/warship/cherrystone/battle_warship_cherrystone
    smallPortrait: units/warship/cherrystone/portrait_warship_cherrystone_small.png
    mediumPortrait: units/warship/cherrystone/portrait_warship_cherrystone_medium.png
    mapSpeed: 6.0
    grabPos: [10, 9]
    battlePosOffset: [-10, -10]
    attackOffset: [20, -10]
    deathMoveMin: 80
    deathMoveMax: 80
    emotes:
      idle: idle
    sounds:
      attackMap: unitAttack
      attack: warshipAttack
      attackEffect: warshipAttackEffect
      death: shipDie
      deathMap: unitDie
      run: waterBoatEntry
      runMap: waterBoatEntry
      hit: hitWood
      hitMap: hitWood
    attacks:
      - id: primary
      #  hitDelay: 2.0
        hitSpark: fx/bs_stab_attack
        ranged: true
        effect: fx/bs_warship_attack
        effectDelay: 1.8
        hitDelay: [2.0, 2.3, 2.6]


