---

weapons:
  - id: sword
    rangeMin: 1
    rangeMax: 1
    canMoveAndAttack: true
    baseDamage:
      land: 1
      buildings: 1
    tagDamageOverwrite: soldier

unitClasses:
  - id: soldier
    name: unit_class_name_soldier
    cost: 100
    movement: walking
    moveRange: 4
    damageMultiplier: 1
    aiPriority: 1.0
    weapons:
      - id: sword
    verbs:
      - capture
      - load
      - rescue
      - hire
    tags:
      - soldier
      - type.ground.light
    battleUnitCount: 4
    passiveMultiplier: 1.5
    sightRange: 4

units:
  - class: soldier
    faction: outlaw
    name: unit_name_soldier_outlaw
    mapAnimation: units/soldier/outlaw/map_soldier_outlaw
    mapLightSource:
      sprite: lights_small
      scale: [1.0, 1.0]
      jitter:
        scale: 1.0
        frequency: 0.3
        frequencyVariance: 0.15
    battleLightSource:
      sprite: lights_battle_medium
      scale: [0.65, 0.35]
      jitter:
        scale: 0.75
        frequency: 0.3
        frequencyVariance: 0.15
    battleAnimation: units/soldier/outlaw/battle_soldier_outlaw
    battleAnimationRiver: fx/river_overlay/battle_soldier_cherrystone_river
    smallPortrait: units/soldier/outlaw/portrait_soldier_outlaw_small.png
    mediumPortrait: units/soldier/outlaw/portrait_soldier_outlaw_medium.png
    mapSpeed: 4.0
    grabPos: [13, 14]
    sounds:
      attack: soldierAttackRed
      attackShout: soldierPreAttackRed
      attackMap: unitAttack
      captureShout: soldierPreAttackRed
      death: soldierDieRed
      deathMap: unitDie
      run: infantryHeavyEntry
      runMap: infantryHeavyMapEntry
      hit: hitOrganic
      hitMap: hitOrganic
    attacks:
      - id: primary
        hitSpark: fx/bs_stab_attack
        hitDelay: [0.45, 0.8]
    shouts:
      soldier_shout1: soldierShoutRed1
      soldier_shout2: soldierShoutRed2
      soldier_shout3: soldierShoutRed3
      soldier_shout4: soldierShoutRed4
      soldier_shout5: soldierShoutRed5
      soldier_shout6: soldierShoutRed6
      soldier_shout7: soldierShoutRed7
      soldier_shout8: soldierShoutRed8
      soldier_shout9: soldierShoutRed9
      soldier_hit1: soldierHitRed1
      soldier_hit2: soldierHitRed2
      soldier_hit3: soldierHitRed3
      soldier_hit4: soldierHitRed4
      soldier_hit5: soldierHitRed5
    emotes:
      idle: idle
      telescope: emote_telescope
...
