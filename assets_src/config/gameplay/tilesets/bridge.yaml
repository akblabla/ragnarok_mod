    primaryConnect: [undefined, bridge]
    secondaryConnect: [plains, forest, mountain, road, street, wall, cobblestone, carpet]
    decayTo: ":below"
    extras:
    # Single tile variation
      - { x: 6, y: 7, mask: 256 }
      - { x: 6, y: 8, mask: 256 }
      - { x: 6, y: 9, mask: 256 }
      - { x: 7, y: 0, mask: 255 }
      - { x: 8, y: 0, mask: 255 }
      - { x: 9, y: 0, mask: 255 }
      - { x: 7, y: 1, mask: 255 }
      - { x: 8, y: 1, mask: 255 }
      - { x: 9, y: 1, mask: 255 }
      - { x: 7, y: 2, mask: 255 }
      - { x: 8, y: 2, mask: 255 }
      - { x: 9, y: 2, mask: 255 }
      - { x: 7, y: 3, mask: 255 }
      - { x: 8, y: 3, mask: 255 }
      - { x: 9, y: 3, mask: 255 }
      - { x: 7, y: 4, mask: 255 }
      - { x: 8, y: 4, mask: 255 }
      - { x: 9, y: 4, mask: 255 }
      - { x: 7, y: 5, mask: 255 }
      - { x: 8, y: 5, mask: 255 }
      - { x: 9, y: 5, mask: 255 }
      - { x: 7, y: 6, mask: 255 }
      - { x: 8, y: 6, mask: 255 }
      - { x: 9, y: 6, mask: 255 }

    # Corner tile variation
      - { x: 0, y: 7, mask: 28 }
      - { x: 4, y: 7, mask: 112 }
      - { x: 0, y: 11, mask: 7 }
      - { x: 4, y: 11, mask: 193 }
    # Outer corner tile variation
      - { x: 1, y: 8, mask: 247 }
      - { x: 2, y: 8, mask: 223 }
      - { x: 1, y: 9, mask: 253 }
      - { x: 2, y: 9, mask: 127 }
    # Side tile variation
      - { x: 1, y: 7, mask: 124 }
      - { x: 2, y: 7, mask: 124 }
      - { x: 3, y: 7, mask: 124 }

      - { x: 0, y: 8, mask: 31 }
      - { x: 0, y: 9, mask: 31 }
      - { x: 0, y: 10, mask: 31 }

      - { x: 4, y: 8, mask: 241 }
      - { x: 4, y: 9, mask: 241 }
      - { x: 4, y: 10, mask: 241 }

      - { x: 1, y: 11, mask: 199 }
      - { x: 2, y: 11, mask: 199 }
      - { x: 3, y: 11, mask: 199 }
    # U-shaped 1 tile wide ending variation
      - { x: 0, y: 12, mask: 4 }
      - { x: 4, y: 12, mask: 64 }
      - { x: 5, y: 7, mask: 16 }
      - { x: 5, y: 11, mask: 1 }
    # Parallel 1 tile beach river variation
      - { x: 1, y: 12, mask: 68 }
      - { x: 2, y: 12, mask: 68 }
      - { x: 3, y: 12, mask: 68 }

      - { x: 5, y: 8, mask: 17 }
      - { x: 5, y: 9, mask: 17 }
      - { x: 5, y: 10, mask: 17 }
    blend:
      # single tile, both sides open
      - { x: 7, y: 9, pattern: ".s.-X-.s." }
      - { x: 7, y: 10, pattern: ".-.sXs.-." }
      # single tile, one side open
      - { x: 8, y: 9, pattern: ".-.-Xs.-." }
      - { x: 8, y: 10, pattern: ".-.sX-.-." }
      - { x: 9, y: 7, pattern: ".-.-X-.s." }
      - { x: 9, y: 8, pattern: ".s.-X-.-." }
      # tails
      - { x: 7, y: 7, pattern: ".s.-X-.b." }
      - { x: 7, y: 8, pattern: ".b.-X-.s." }
      - { x: 8, y: 7, pattern: ".-.sXb.-." }
      - { x: 8, y: 8, pattern: ".-.bXs.-." }
